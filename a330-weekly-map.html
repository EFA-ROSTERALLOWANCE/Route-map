<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A330 Weekly Roster Map & Search</title>
<style>
  :root{
    --bg:#0b1220; --panel:#121b2e; --panel2:#0f1830; --border:#22304d;
    --text:#e8edf7; --muted:#8ea0c2; --accent:#4fa3ff; --accent2:#ff9f43;
    --op:#3ddc97; --pax:#ffb454; --red:#ff5d5d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);
    display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;}
  header .sub{font-size:11px;color:var(--muted);}

  .tabs{display:flex;gap:6px;background:var(--panel2);border-radius:10px;padding:4px;}
  .tab{flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;
    color:var(--muted);cursor:pointer;user-select:none;}
  .tab.active{background:var(--accent);color:#04101f;}

  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=text]{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:8px;font-size:13px;outline:none;flex:1;min-width:120px;
  }
  .chip{padding:6px 10px;border-radius:20px;font-size:12px;border:1px solid var(--border);
    background:var(--panel2);color:var(--muted);cursor:pointer;user-select:none;}
  .chip.active{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:700;}

  main{flex:1;overflow:hidden;position:relative;}
  #listView, #dayView{position:absolute;inset:0;overflow-y:auto;display:none;}
  #listView.show{display:block;}
  #dayView.show{display:flex;flex-direction:column;}

  #map{flex:1 1 45%;min-height:200px;background:#0d1730;position:relative;overflow:hidden;}
  #map svg{width:100%;height:100%;display:block;}
  .mapLabel{font-size:9px;fill:#8ea0c2;font-family:inherit;}
  .mapPort{fill:#4fa3ff;stroke:#0d1730;stroke-width:1;}
  .mapGrat{stroke:#1c2a4a;stroke-width:0.5;}

  #dayPanel{flex:1 1 55%;overflow-y:auto;border-top:1px solid var(--border);background:var(--panel);}

  .flightRow{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}
  .rowTop{display:flex;justify-content:space-between;align-items:center;}
  .flightNo{font-weight:700;font-size:14px;}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
  .badge.op{background:rgba(61,220,151,.15);color:var(--op);}
  .badge.pax{background:rgba(255,180,84,.15);color:var(--pax);}
  .route{font-size:15px;font-weight:600;}
  .meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
  .dayHeader{position:sticky;top:0;background:var(--bg);color:var(--accent);font-size:13px;
    font-weight:700;padding:10px 14px 5px;letter-spacing:.4px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;}
  .dayHeader .n{color:var(--muted);font-weight:500;font-size:11px;}

  .dayNav{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);
    border-bottom:1px solid var(--border);}
  .navBtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;}
  .dayLabel{flex:1;text-align:center;font-size:16px;font-weight:700;}
  .daySub{text-align:center;font-size:11px;color:var(--muted);}

  .weekPicker{display:flex;gap:4px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);}
  .wchip{flex:1;text-align:center;padding:8px 2px;border-radius:8px;font-size:12px;font-weight:700;
    background:var(--panel2);color:var(--muted);border:1px solid var(--border);cursor:pointer;}
  .wchip.active{background:var(--accent);color:#04101f;border-color:var(--accent);}

  #dayPanel .empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px;}

  .legend{display:flex;gap:14px;padding:8px 14px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.op{background:var(--op);}
  .dot.pax{background:var(--pax);}

  .count{font-size:11px;color:var(--muted);padding:6px 14px;}
  .provenance{font-size:10px;color:#5b6f95;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>✈️ EFA A330 Weekly Schedule</h1>
    <div class="sub" id="subHeader">Loading…</div>
    <div class="tabs">
      <div class="tab active" data-tab="list">All Flights (by Day)</div>
      <div class="tab" data-tab="day">Search by Weekday + Map</div>
    </div>
    <div class="controls" id="listControls">
      <input type="text" id="searchBox" placeholder="Search flight no, port, pilot…">
      <div class="chip active" data-filter="all">All</div>
      <div class="chip" data-filter="op">Operating</div>
      <div class="chip" data-filter="pax">Pax/Positioning</div>
    </div>
  </header>

  <main>
    <div id="listView" class="show">
      <div class="count" id="listCount"></div>
      <div id="listBody"></div>
    </div>

    <div id="dayView">
      <div class="dayNav">
        <div class="navBtn" id="prevDay">◀</div>
        <div style="flex:1;">
          <div class="dayLabel" id="dayLabel">Monday</div>
          <div class="daySub" id="daySub"></div>
        </div>
        <div class="navBtn" id="nextDay">▶</div>
      </div>
      <div class="weekPicker" id="weekPicker"></div>
      <div id="map"><svg id="mapSvg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div id="dayPanel">
        <div id="dayFlights"></div>
      </div>
    </div>
  </main>

  <div class="legend">
    <span><span class="dot op"></span>Operating (crew flying)</span>
    <span><span class="dot pax"></span>Pax / deadhead / positioning</span>
  </div>
</div>

const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const WEEKDAY_FULL = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};

function fmtT(t){ return t.slice(0,2)+":"+t.slice(2); }

document.getElementById('subHeader').textContent =
  `${FLIGHTS.length} A330 flight legs · shown as a recurring WEEKLY pattern (by day-of-week, not calendar date) · Pappin, Peters, Beattie, Fuller, Hudson`;

// ---------- LIST VIEW (grouped by weekday) ----------
const listBody = document.getElementById('listBody');
const listCount = document.getElementById('listCount');
let currentFilter = 'all';
let currentSearch = '';

function flightRowHTML(r){
  const depName = (AIRPORTS[r.dep]||{}).name || r.dep;
  const arrName = (AIRPORTS[r.arr]||{}).name || r.arr;
  return `
    <div class="flightRow">
      <div class="rowTop">
        <span class="flightNo">QF${r.flight}</span>
        <span class="badge ${r.op?'op':'pax'}">${r.op?'Operating':'Pax'}</span>
      </div>
      <div class="route">${r.dep} ${fmtT(r.depT)} → ${r.arr} ${fmtT(r.arrT)}</div>
      <div class="meta">
        <span>${depName} → ${arrName}</span>
        <span>${r.eq}</span>
        <span>${r.pilot}</span>
        ${r.op?`<span>Blk ${r.blk}</span>`:''}
      </div>
      <div class="provenance">observed ${r.date} · BP${r.bp}</div>
    </div>`;
}

function renderList(){
  let rows = FLIGHTS.slice();
  if(currentFilter==='op') rows = rows.filter(r=>r.op);
  if(currentFilter==='pax') rows = rows.filter(r=>!r.op);
  if(currentSearch){
    const q = currentSearch.toLowerCase();
    rows = rows.filter(r =>
      r.flight.toLowerCase().includes(q) ||
      r.dep.toLowerCase().includes(q) ||
      r.arr.toLowerCase().includes(q) ||
      r.pilot.toLowerCase().includes(q)
    );
  }
  listCount.textContent = `${rows.length} flight legs`;

  rows.sort((a,b)=> WEEKDAYS.indexOf(a.wd)-WEEKDAYS.indexOf(b.wd) || a.depT.localeCompare(b.depT));

  let html = '';
  let lastWd = null;
  for(const r of rows){
    if(r.wd !== lastWd){
      const dayCount = rows.filter(x=>x.wd===r.wd).length;
      html += `<div class="dayHeader"><span>${WEEKDAY_FULL[r.wd]}</span><span class="n">${dayCount} legs</span></div>`;
      lastWd = r.wd;
    }
    html += flightRowHTML(r);
  }
  listBody.innerHTML = html || `<div class="empty">No flights match.</div>`;
}

document.getElementById('searchBox').addEventListener('input', e=>{
  currentSearch = e.target.value.trim();
  renderList();
});
document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderList();
  });
});

// ---------- TABS ----------
document.querySelectorAll('.tab').forEach(tab=>{

// ---------- MAP (self-contained SVG, no external tiles — works fully offline) ----------
const svg = document.getElementById('mapSvg');
const SVG_NS = "http://www.w3.org/2000/svg";
const VB_W = 800, VB_H = 600;
const PROJ = { lonMin: 95, lonMax: 182, latMin: -42, latMax: 8 };

function project(lat, lon){
  const x = (lon - PROJ.lonMin) / (PROJ.lonMax - PROJ.lonMin) * VB_W;
  const y = (PROJ.latMax - lat) / (PROJ.latMax - PROJ.latMin) * VB_H;
  return [x,y];
}
function el(tag, attrs){
  const e = document.createElementNS(SVG_NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function drawGraticule(){
  const g = el('g', {});
  for(let lon=100; lon<=180; lon+=10){
    const [x1,y1] = project(PROJ.latMax, lon);
    const [x2,y2] = project(PROJ.latMin, lon);
    g.appendChild(el('line',{x1,y1,x2,y2,class:'mapGrat'}));
  }
  for(let lat=-40; lat<=0; lat+=10){
    const [x1,y1] = project(lat, PROJ.lonMin);
    const [x2,y2] = project(lat, PROJ.lonMax);
    g.appendChild(el('line',{x1,y1,x2,y2,class:'mapGrat'}));
  }
  svg.appendChild(g);
}
function curvedPath(p1, p2){
  const [x1,y1] = project(p1[0], p1[1]);
  const [x2,y2] = project(p2[0], p2[1]);
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const dx = x2-x1, dy = y2-y1;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const bulge = Math.min(dist*0.18, 60);
  let offx = -dy/dist*bulge, offy = dx/dist*bulge;
  if(offy > 0){ offx = -offx; offy = -offy; }
  const cx = mx+offx, cy = my+offy;
  return `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
}
function clearMap(){ svg.innerHTML = ''; }

function drawFlightsOnMap(flights){
  clearMap();
  drawGraticule();
  const linesGroup = el('g',{});
  const portsGroup = el('g',{});
  const labelsGroup = el('g',{});
  svg.appendChild(linesGroup);
  svg.appendChild(portsGroup);
  svg.appendChild(labelsGroup);

  flights.forEach(r=>{
    const dep = AIRPORTS[r.dep], arr = AIRPORTS[r.arr];
    if(!dep || !arr) return;
    const color = r.op ? '#3ddc97' : '#ffb454';
    const d = curvedPath([dep.lat,dep.lon],[arr.lat,arr.lon]);
    const path = el('path',{d, stroke:color, fill:'none', 'stroke-width':2.4, 'stroke-opacity':0.9, 'stroke-linecap':'round'});
    const title = el('title',{});
    title.textContent = `QF${r.flight} ${r.op?'Operating':'Pax'} · ${r.dep} ${fmtT(r.depT)} → ${r.arr} ${fmtT(r.arrT)} · ${r.pilot} · ${r.eq}`;
    path.appendChild(title);
    linesGroup.appendChild(path);
  });

  const usedPorts = new Set();
  flights.forEach(r=>{ usedPorts.add(r.dep); usedPorts.add(r.arr); });
  usedPorts.forEach(code=>{
    const a = AIRPORTS[code];
    if(!a) return;
    const [x,y] = project(a.lat, a.lon);
    const circle = el('circle',{cx:x, cy:y, r:5, class:'mapPort'});
    const t = el('title',{}); t.textContent = `${code} — ${a.name}`;
    circle.appendChild(t);
    portsGroup.appendChild(circle);
    const label = el('text',{x:x+7, y:y-6, class:'mapLabel'});
    label.textContent = code;
    labelsGroup.appendChild(label);
  });
}

// ---------- WEEKDAY NAV ----------
let currentWdIdx = 0;
const dayLabel = document.getElementById('dayLabel');
const daySub = document.getElementById('daySub');
const dayFlights = document.getElementById('dayFlights');
const weekPicker = document.getElementById('weekPicker');

WEEKDAYS.forEach((wd,i)=>{
  const chip = document.createElement('div');
  chip.className = 'wchip' + (i===0?' active':'');
  chip.textContent = wd;
  chip.addEventListener('click', ()=> showWeekday(i));
  weekPicker.appendChild(chip);
});

function showWeekday(idx){
  currentWdIdx = ((idx % 7) + 7) % 7;
  const wd = WEEKDAYS[currentWdIdx];
  const flights = FLIGHTS.filter(f=>f.wd===wd).sort((a,b)=>a.depT.localeCompare(b.depT));

  dayLabel.textContent = WEEKDAY_FULL[wd];
  document.querySelectorAll('.wchip').forEach((c,i)=>c.classList.toggle('active', i===currentWdIdx));

  if(flights.length===0){
    daySub.textContent = 'No A330 flights typically on this day';
    dayFlights.innerHTML = `<div class="empty">No rostered A330 operating or pax flights observed on ${WEEKDAY_FULL[wd]}s in the source rosters.</div>`;
    clearMap();
    return;
  }
  daySub.textContent = `${flights.length} flight leg${flights.length>1?'s':''} typically rostered on ${WEEKDAY_FULL[wd]}s`;
  drawFlightsOnMap(flights);
  dayFlights.innerHTML = flights.map(flightRowHTML).join('');
}

document.getElementById('prevDay').addEventListener('click', ()=> showWeekday(currentWdIdx-1));
document.getElementById('nextDay').addEventListener('click', ()=> showWeekday(currentWdIdx+1));

// init
renderList();
showWeekday(0);
</script>
