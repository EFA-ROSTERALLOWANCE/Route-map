<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EFA Standby Coverage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#121b2e; --panel2:#0f1830; --border:#22304d;
    --text:#e8edf7; --muted:#8ea0c2; --accent:#4fa3ff; --accent2:#ff9f43;
    --op:#3ddc97; --pax:#ffb454; --red:#ff5d5d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #app{max-width:820px;margin:0 auto;padding:0 0 40px;}

  header{padding:14px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  header .sub{font-size:11px;color:var(--muted);margin-top:3px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin:14px;padding:14px;}
  .grp{margin-bottom:14px;}
  .grp:last-child{margin-bottom:0;}
  .grp label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:7px;font-weight:700;}

  .btnRow{display:flex;gap:8px;flex-wrap:wrap;}
  .opt{flex:1;min-width:64px;text-align:center;padding:11px 8px;border-radius:10px;font-size:14px;font-weight:700;
    background:var(--panel2);color:var(--muted);border:1px solid var(--border);cursor:pointer;user-select:none;
    transition:background .12s,color .12s,border-color .12s;}
  .opt small{display:block;font-weight:500;font-size:10px;opacity:.8;margin-top:2px;}
  .opt.active{background:var(--accent);color:#04101f;border-color:var(--accent);}
  .opt.day{min-width:0;flex:1;padding:10px 2px;font-size:13px;}

  select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:12px 10px;border-radius:10px;font-size:15px;outline:none;font-weight:600;}

  .summary{margin:0 14px 4px;padding:12px 14px;border-radius:12px;background:var(--panel2);
    border:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;}
  .summary .k{color:var(--muted);}
  .summary .v{font-weight:700;}
  .summary .win{color:var(--accent);font-weight:700;}
  .summary .n{margin-left:auto;font-weight:800;font-size:15px;}
  .summary .n.zero{color:var(--muted);}

  #map{margin:14px;border-radius:12px;overflow:hidden;height:52vh;min-height:300px;border:1px solid var(--border);z-index:0;}
  .leaflet-container{background:#e8edf3;font-family:inherit;}
  .portLbl{color:#0b1a33;font-size:10px;font-weight:700;text-shadow:0 1px 2px #fff,0 0 3px #fff;white-space:nowrap;}
  .leaflet-tooltip{background:#121b2e;border:1px solid #2b3d61;color:#e8edf7;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.4);}
  .leaflet-tooltip-top:before{border-top-color:#2b3d61;}
  .leaflet-tooltip-left:before{border-left-color:#2b3d61;}
  .leaflet-tooltip-right:before{border-right-color:#2b3d61;}
  .leaflet-bar a{background:#121b2e;color:#e8edf7;border-bottom-color:#22304d;}
  .leaflet-bar a:hover{background:#1b2947;}
  .leaflet-control-attribution{background:rgba(255,255,255,.8)!important;color:#5b6f95!important;}
  .leaflet-control-attribution a{color:#365f9c!important;}
  .leaflet-container.darkmap{background:#0d1730;}
  .darkmap .portLbl{color:#cfe0ff;text-shadow:0 1px 3px #000,0 0 3px #000;}
  .darkmap .leaflet-control-attribution{background:rgba(11,18,32,.75)!important;color:#6f83a8!important;}
  .darkmap .leaflet-control-attribution a{color:#8ea0c2!important;}

  .mapStyleRow{display:flex;align-items:center;gap:6px;margin:14px 14px 0;}
  .mapStyleRow .msLbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-right:4px;}
  .msOpt{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:pointer;user-select:none;}
  .msOpt.active{background:var(--accent);color:#04101f;border-color:var(--accent);}
  .crewToggle{display:flex;align-items:center;gap:6px;padding:12px 14px 0;}
  .crewToggle[hidden]{display:none;}

  .flightRow{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}
  .rowTop{display:flex;justify-content:space-between;align-items:center;}
  .flightNo{font-weight:700;font-size:14px;}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
  .badge.op{background:rgba(61,220,151,.15);color:var(--op);}
  .badge.eq{background:rgba(79,163,255,.14);color:var(--accent);}
  .route{font-size:15px;font-weight:600;}
  .meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
  .listHdr{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.4px;padding:6px 14px;}
  .empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5;}

  .legend{display:flex;gap:16px;padding:10px 14px;font-size:11px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.op{background:var(--op);}
  .dot.home{background:var(--accent2);}
  .dot.used{background:var(--accent);}

  .flightRow.tappable{cursor:pointer;}
  .flightRow.tappable:active{background:#182541;}
  .tapHint{color:var(--accent);font-weight:700;margin-left:auto;}

  .overlay{position:fixed;inset:0;background:rgba(4,10,20,.62);display:flex;align-items:flex-end;justify-content:center;z-index:1000;}
  .overlay[hidden]{display:none;}
  .sheet{background:var(--panel);width:100%;max-width:820px;max-height:88vh;border-radius:16px 16px 0 0;
    border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  @media(min-width:600px){ .overlay{align-items:center;} .sheet{border-radius:16px;} }
  .sheetHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px;border-bottom:1px solid var(--border);}
  .sheetTitle{font-size:16px;font-weight:800;}
  .sheetSub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .closeBtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;
    width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0;}
  .sheetBody{padding:12px 14px 22px;overflow-y:auto;}
  .patDay{margin-bottom:16px;}
  .patDate{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.4px;margin-bottom:8px;}
  .patLeg{border:1px solid var(--border);border-left-width:4px;border-radius:8px;padding:9px 11px;margin-bottom:7px;background:var(--panel2);}
  .patLeg.op{border-left-color:var(--op);}
  .patLeg.pax{border-left-color:var(--pax);}
  .patLeg.hi{outline:2px solid var(--accent);outline-offset:-1px;}
  .plTop{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .plNo{font-weight:700;font-size:13.5px;}
  .plEq{font-size:11px;color:var(--muted);white-space:nowrap;}
  .pTag{font-size:9px;font-weight:800;background:rgba(255,180,84,.18);color:var(--pax);padding:1px 6px;border-radius:10px;letter-spacing:.4px;}
  .opTag{font-size:9px;font-weight:800;background:rgba(61,220,151,.16);color:var(--op);padding:1px 6px;border-radius:10px;letter-spacing:.4px;}
  .plRoute{font-size:14px;font-weight:600;margin-top:3px;}
  .plGrnd{font-size:11px;color:var(--muted);margin-top:2px;}
  .patDuty{font-size:11px;color:var(--muted);padding:4px 2px 2px;border-top:1px dashed var(--border);margin-top:2px;}
  .patFooter{font-size:11.5px;color:var(--muted);font-weight:700;padding:8px 2px 0;border-top:1px solid var(--border);margin-top:4px;}
  .patEmpty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="app">
  <header>
    <h1>✈️ EFA Standby Coverage</h1>
    <div class="sub">Pick your base, fleet, standby code &amp; weekday to see the operating freighters that could be called out (incl. a 5 h call-out lead time).</div>
  </header>

  <div class="card">
    <div class="grp">
      <label>Base</label>
      <div class="btnRow" id="baseRow">
        <div class="opt" data-base="MEL">MEL</div>
        <div class="opt" data-base="SYD">SYD<small>incl. WSI</small></div>
        <div class="opt" data-base="BNE">BNE</div>
      </div>
    </div>
    <div class="grp">
      <label>Fleet</label>
      <div class="btnRow" id="fleetRow">
        <div class="opt" data-fleet="A330">A330</div>
        <div class="opt" data-fleet="A321">A320</div>
      </div>
    </div>
    <div class="grp">
      <label>Standby / Reserve code</label>
      <select id="sbSelect">
        <option value="">Select standby code…</option>
      </select>
    </div>
    <div class="grp">
      <label>Day of week</label>
      <div class="btnRow" id="dayRow"></div>
    </div>
  </div>

  <div class="summary" id="summary" style="display:none;"></div>

  <div class="mapStyleRow" id="mapStyleRow">
    <span class="msLbl">Map</span>
    <div class="msOpt active" data-style="light">Light</div>
    <div class="msOpt" data-style="dark">Dark</div>
  </div>

  <div id="map"></div>

  <div class="legend">
    <span><span class="dot home"></span>Your base</span>
    <span><span class="dot used"></span>Ports served</span>
    <span><span class="dot op"></span>Operating flight</span>
  </div>

  <div id="listHdr" class="listHdr"></div>
  <div id="list"></div>
</div>

<div id="patternOverlay" class="overlay" hidden>
  <div class="sheet">
    <div class="sheetHead">
      <div>
        <div class="sheetTitle" id="patTitle"></div>
        <div class="sheetSub" id="patSub"></div>
      </div>
      <button class="closeBtn" id="patClose" aria-label="Close">✕</button>
    </div>
    <div id="crewToggle" class="crewToggle" hidden>
      <span class="msLbl">Crew</span>
      <div class="msOpt active" data-crew="normal">Normal</div>
      <div class="msOpt" data-crew="z">Z crew</div>
    </div>
    <div class="sheetBody" id="patBody"></div>
  </div>
</div>

<script>
// ---------- STANDBY / RESERVE WINDOWS ----------
const STANDBY = [
  {code:'V15', start:'00:01', end:'09:00'},
  {code:'V1',  start:'00:01', end:'06:00'},
  {code:'V2',  start:'03:00', end:'12:00'},
  {code:'V4',  start:'04:00', end:'12:00'},
  {code:'V5',  start:'05:01', end:'13:00'},
  {code:'V6',  start:'06:00', end:'12:00'},
  {code:'V65', start:'06:00', end:'14:00'},
  {code:'V11', start:'07:00', end:'15:00'},
  {code:'V8',  start:'08:00', end:'16:00'},
  {code:'V9',  start:'09:00', end:'17:00'},
  {code:'V63', start:'10:00', end:'15:00'},
  {code:'V7',  start:'10:00', end:'18:00'},
  {code:'V10', start:'10:00', end:'20:00'},
  {code:'V12', start:'12:00', end:'22:00'},
  {code:'V61', start:'17:00', end:'22:00'},
  {code:'V3',  start:'17:00', end:'23:59'},
  {code:'V16', start:'16:00', end:'23:59'},
  {code:'V30', start:'15:00', end:'22:00'},
];

// ---------- FREIGHTER SCHEDULE (from Qantas Freight timetable) ----------
// op = operating (all true for now). days = weekdays the flight departs.
const M4=['Mon','Tue','Wed','Thu'], T4=['Tue','Wed','Thu','Fri'], T3=['Tue','Wed','Thu'];
const FLIGHTS = [
  // A330 domestic
  {flight:'7301', dep:'SYD', arr:'WSI', fleet:'A330', net:'Domestic',      std:'12:30', sta:'13:15', days:['Mon']},
  {flight:'7345', dep:'WSI', arr:'MEL', fleet:'A330', net:'Domestic',      std:'22:50', sta:'00:25', days:M4},
  {flight:'7359', dep:'MEL', arr:'PER', fleet:'A330', net:'Domestic',      std:'01:55', sta:'04:05', days:T4},
  {flight:'7318', dep:'PER', arr:'WSI', fleet:'A330', net:'Domestic',      std:'13:50', sta:'19:50', days:T3},
  // A321 domestic
  {flight:'7313', dep:'CNS', arr:'BNE', fleet:'A321', net:'Domestic',      std:'19:10', sta:'21:25', days:M4},
  {flight:'7335', dep:'BNE', arr:'MEL', fleet:'A321', net:'Domestic',      std:'22:20', sta:'00:45', days:M4},
  {flight:'7353', dep:'MEL', arr:'BNE', fleet:'A321', net:'Domestic',      std:'01:40', sta:'03:55', days:T4},
  {flight:'7332', dep:'BNE', arr:'TSV', fleet:'A321', net:'Domestic',      std:'04:50', sta:'06:55', days:T4},
  {flight:'7321', dep:'TSV', arr:'CNS', fleet:'A321', net:'Domestic',      std:'07:35', sta:'08:20', days:T4},
  {flight:'7376', dep:'HBA', arr:'LST', fleet:'A321', net:'Domestic',      std:'20:00', sta:'20:30', days:M4},
  {flight:'7365', dep:'LST', arr:'MEL', fleet:'A321', net:'Domestic',      std:'21:00', sta:'22:05', days:M4},
  {flight:'7350', dep:'MEL', arr:'BNE', fleet:'A321', net:'Domestic',      std:'23:00', sta:'01:15', days:M4},
  {flight:'7305', dep:'BNE', arr:'MEL', fleet:'A321', net:'Domestic',      std:'02:10', sta:'04:35', days:T4},
  {flight:'7398', dep:'PER', arr:'MEL', fleet:'A321', net:'Domestic',      std:'19:15', sta:'00:45', days:M4},
  {flight:'7356', dep:'MEL', arr:'LST', fleet:'A321', net:'Domestic',      std:'02:25', sta:'03:30', days:T4},
  {flight:'7367', dep:'LST', arr:'HBA', fleet:'A321', net:'Domestic',      std:'04:25', sta:'04:55', days:T4},
  {flight:'7354', dep:'MEL', arr:'WSI', fleet:'A321', net:'Domestic',      std:'20:05', sta:'21:30', days:M4},
  {flight:'7340', dep:'WSI', arr:'BNE', fleet:'A321', net:'Domestic',      std:'22:25', sta:'00:05', days:M4},
  {flight:'7330', dep:'BNE', arr:'MEL', fleet:'A321', net:'Domestic',      std:'01:00', sta:'03:25', days:T4},
  {flight:'7390', dep:'MEL', arr:'PER', fleet:'A321', net:'Domestic',      std:'03:50', sta:'06:00', days:T4},
  // A330 international
  {flight:'7525', dep:'SYD', arr:'HKG', fleet:'A330', net:'International',  std:'12:20', sta:'19:50', days:['Wed','Sun']},
  {flight:'7526', dep:'HKG', arr:'SYD', fleet:'A330', net:'International',  std:'23:45', sta:'11:05', days:['Wed','Fri','Sun']},
  {flight:'7531', dep:'PER', arr:'HKG', fleet:'A330', net:'International',  std:'14:00', sta:'22:00', days:['Fri']},
  {flight:'7535', dep:'SYD', arr:'PVG', fleet:'A330', net:'International',  std:'15:25', sta:'00:20', days:['Thu','Sat']},
  {flight:'7536', dep:'PVG', arr:'SIN', fleet:'A330', net:'International',  std:'02:40', sta:'08:30', days:['Wed','Sun']},
  {flight:'7536', dep:'SIN', arr:'SYD', fleet:'A330', net:'International',  std:'11:00', sta:'20:40', days:['Wed','Sun']},
  // A321 international
  {flight:'7523', dep:'SYD', arr:'AKL', fleet:'A321', net:'International',  std:'22:10', sta:'03:10', days:['Mon','Tue','Wed','Thu','Sat']},
  {flight:'7523', dep:'AKL', arr:'CHC', fleet:'A321', net:'International',  std:'04:10', sta:'05:25', days:['Tue','Wed','Thu','Fri','Sun']},
  {flight:'7524', dep:'CHC', arr:'SYD', fleet:'A321', net:'International',  std:'06:25', sta:'07:40', days:['Tue','Wed','Thu','Fri','Sun']},
  // Positioning start for MEL-based A330 crew (Wed): position MEL->SYD, then operate QF7535 (see pattern).
  {flight:'470', dep:'MEL', arr:'SYD', fleet:'A330', net:'Positioning start', std:'17:05', sta:'18:35', days:['Wed','Thu'], pax:true, ac:'73H'},
];

// A SYD-base standby also covers Western Sydney (WSI) departures.
const BASE_PORTS = { MEL:['MEL'], SYD:['SYD','WSI'], BNE:['BNE'] };

const AIRPORTS = {
  SYD:{lat:-33.9399,lon:151.1753,name:"Sydney"},
  WSI:{lat:-33.9114,lon:150.7406,name:"Western Sydney"},
  MEL:{lat:-37.6690,lon:144.8410,name:"Melbourne"},
  BNE:{lat:-27.3842,lon:153.1175,name:"Brisbane"},
  PER:{lat:-31.9403,lon:115.9669,name:"Perth"},
  CNS:{lat:-16.8858,lon:145.7554,name:"Cairns"},
  TSV:{lat:-19.2526,lon:146.7654,name:"Townsville"},
  HBA:{lat:-42.8361,lon:147.5103,name:"Hobart"},
  LST:{lat:-41.5453,lon:147.2140,name:"Launceston"},
  HKG:{lat:22.3080,lon:113.9185,name:"Hong Kong"},
  PVG:{lat:31.1443,lon:121.8083,name:"Shanghai Pudong"},
  SIN:{lat:1.3644,lon:103.9915,name:"Singapore Changi"},
  AKL:{lat:-37.0082,lon:174.7850,name:"Auckland"},
  CHC:{lat:-43.4894,lon:172.5322,name:"Christchurch"},
};

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_FULL = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};

// ---------- state ----------
const sel = { base:null, fleet:null, sb:null, day:null };
const LEAD_MIN = 300; // 5-hour call-out lead time: standby reaches this far past its end
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtMin(m){ const nd = m>=1440?' +1':''; m=((m%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+nd; }

// ---------- populate controls ----------
const sbSelect = document.getElementById('sbSelect');
STANDBY.forEach(s=>{
  const o=document.createElement('option');
  o.value=s.code; o.textContent=`${s.code}  —  ${s.start} to ${s.end}`;
  sbSelect.appendChild(o);
});
const dayRow = document.getElementById('dayRow');
DAYS.forEach(d=>{
  const el=document.createElement('div');
  el.className='opt day'; el.dataset.day=d; el.textContent=d;
  dayRow.appendChild(el);
});

function bindGroup(rowId, key){
  document.getElementById(rowId).addEventListener('click', e=>{
    const opt = e.target.closest('.opt'); if(!opt) return;
    const row = document.getElementById(rowId);
    row.querySelectorAll('.opt').forEach(o=>o.classList.remove('active'));
    opt.classList.add('active');
    sel[key] = opt.dataset[key];
    update();
  });
}
bindGroup('baseRow','base');
bindGroup('fleetRow','fleet');
bindGroup('dayRow','day');
sbSelect.addEventListener('change', ()=>{ sel.sb = sbSelect.value || null; update(); });

// ---------- coverage ----------
function coveredFlights(){
  const sb = STANDBY.find(s=>s.code===sel.sb);
  const ports = BASE_PORTS[sel.base] || [];
  const s = toMin(sb.start), e = toMin(sb.end) + LEAD_MIN; // extend reach by lead time
  const di = DAYS.indexOf(sel.day), nextDay = DAYS[(di+1)%7];
  return FLIGHTS.filter(f => {
    if(f.fleet!==sel.fleet) return false;
    if(!ports.includes(f.dep)) return false;
    const std = toMin(f.std);
    // departs on the standby day, within [start, end+lead]
    if(f.days.includes(sel.day) && std>=s && std<=e) return true;
    // early next-day departure caught when the window extends past midnight
    if(f.days.includes(nextDay) && (std+1440)>=s && (std+1440)<=e) return true;
    return false;
  }).sort((a,b)=> toMin(a.std)-toMin(b.std));
}

// ---------- MAP (Leaflet + OpenStreetMap / CARTO basemap, light or dark) ----------
const BASEMAPS = {
  light:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
};
let map=null, arcLayer=null, portLayer=null, tileLayer=null, mapStyle='light';
function setBasemap(style){
  mapStyle = style;
  document.getElementById('map').classList.toggle('darkmap', style==='dark');
  if(!map) return;
  if(tileLayer) map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(BASEMAPS[style], { subdomains:'abcd', maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
  }).addTo(map);
}
if(typeof L !== 'undefined'){
  map = L.map('map', { zoomControl:true, worldCopyJump:true }).setView([-25, 140], 3);
  setBasemap('light');
  setTimeout(()=>map.invalidateSize(), 200);
  window.addEventListener('resize', ()=>map.invalidateSize());
  arcLayer = L.layerGroup().addTo(map);
  portLayer = L.layerGroup().addTo(map);
}else{
  document.getElementById('map').innerHTML =
    '<div style="padding:24px;text-align:center;color:#8ea0c2;font-size:13px;line-height:1.5;">Map couldn’t load (no connection?).<br>The coverage list below still works.</div>';
}
document.getElementById('mapStyleRow').addEventListener('click', e=>{
  const opt=e.target.closest('.msOpt'); if(!opt) return;
  document.querySelectorAll('#mapStyleRow .msOpt').forEach(o=>o.classList.remove('active'));
  opt.classList.add('active');
  setBasemap(opt.dataset.style);
});

// quadratic-bezier arc (bulges toward higher latitude) for a great-circle-ish look
function arcPoints(a,b){
  const dx=b.lon-a.lon, dy=b.lat-a.lat, dist=Math.sqrt(dx*dx+dy*dy)||1, k=0.15;
  let ox=-dy/dist*dist*k, oy=dx/dist*dist*k;
  if(oy<0){ ox=-ox; oy=-oy; }
  const clat=(a.lat+b.lat)/2+oy, clon=(a.lon+b.lon)/2+ox, pts=[];
  for(let t=0;t<=1.0001;t+=1/24){ const u=1-t;
    pts.push([u*u*a.lat+2*u*t*clat+t*t*b.lat, u*u*a.lon+2*u*t*clon+t*t*b.lon]); }
  return pts;
}

function addPort(code, kind){
  const a=AIRPORTS[code]; if(!a) return;
  const color = kind==='home' ? '#ff9f43' : '#4fa3ff';
  L.circleMarker([a.lat,a.lon], {radius: kind==='home'?7:5, color:'#0d1730', weight:1.5,
    fillColor:color, fillOpacity:1}).bindTooltip(`${code} — ${a.name}`,{direction:'top'}).addTo(portLayer);
  L.marker([a.lat,a.lon], {interactive:false,
    icon:L.divIcon({className:'', html:`<span class="portLbl">${code}</span>`, iconSize:[0,0], iconAnchor:[-8,4]})}).addTo(portLayer);
}

function drawMap(flights){
  if(!map) return;
  arcLayer.clearLayers(); portLayer.clearLayers();
  const homePorts = new Set(sel.base ? (BASE_PORTS[sel.base]||[]) : []);
  const used = new Set(); const bounds = [];
  (flights||[]).forEach(r=>{
    const dep=AIRPORTS[r.dep], arr=AIRPORTS[r.arr]; if(!dep||!arr) return;
    used.add(r.dep); used.add(r.arr);
    const pts = arcPoints(dep,arr);
    L.polyline(pts, {color:(r.pax?'#ffb454':'#3ddc97'), weight:2.6, opacity:.92, dashArray:(r.pax?'6 5':null)})
      .bindTooltip(`QF${r.flight} · ${r.dep} ${r.std} → ${r.arr} ${r.sta} · ${r.ac || (r.fleet==='A321'?'A320':r.fleet)} · tap for pattern`)
      .on('click', ()=>openPattern(r.flight, sel.day))
      .addTo(arcLayer);
    pts.forEach(p=>bounds.push(p));
  });
  homePorts.forEach(code=> addPort(code,'home'));
  used.forEach(code=>{ if(!homePorts.has(code)) addPort(code,'used'); });
  homePorts.forEach(code=>{ const a=AIRPORTS[code]; if(a) bounds.push([a.lat,a.lon]); });
  if(bounds.length){ map.fitBounds(bounds, {padding:[45,45], maxZoom:6}); }
}

// ---------- render ----------
const summary=document.getElementById('summary');
const listHdr=document.getElementById('listHdr');
const list=document.getElementById('list');

function flightRowHTML(r){
  const depName=(AIRPORTS[r.dep]||{}).name||r.dep;
  const arrName=(AIRPORTS[r.arr]||{}).name||r.arr;
  return `
    <div class="flightRow tappable" data-flight="${r.flight}">
      <div class="rowTop">
        <span class="flightNo">QF${r.flight}</span>
        <span>
          <span class="badge ${r.pax?'pax':'op'}">${r.pax?'Positioning':'Operating'}</span>
          <span class="badge eq">${r.ac || (r.fleet==='A321'?'A320':r.fleet)}</span>
        </span>
      </div>
      <div class="route">${r.dep} ${r.std} → ${r.arr} ${r.sta}</div>
      <div class="meta"><span>${depName} → ${arrName}</span><span>${r.net}</span><span class="tapHint">View pattern ›</span></div>
    </div>`;
}

function update(){
  const complete = sel.base && sel.fleet && sel.sb && sel.day;
  if(!complete){
    summary.style.display='none';
    drawMap([]);
    listHdr.textContent='';
    list.innerHTML = `<div class="empty">Choose a <b>base</b>, <b>fleet</b>, <b>standby code</b> and <b>day</b> above to see the operating freighters that depart within your standby window, plus a 5 h call-out lead time.</div>`;
    return;
  }
  const sb = STANDBY.find(s=>s.code===sel.sb);
  const flights = coveredFlights();
  const fleetLabel = sel.fleet==='A321'?'A320':sel.fleet;

  const reach = fmtMin(toMin(sb.end)+LEAD_MIN); // effective latest departure

  summary.style.display='flex';
  summary.innerHTML =
    `<span><span class="k">Base</span> <span class="v">${sel.base}</span></span>`+
    `<span><span class="k">Fleet</span> <span class="v">${fleetLabel}</span></span>`+
    `<span><span class="k">${sb.code}</span> <span class="win">${sb.start}–${sb.end}</span></span>`+
    `<span><span class="k">Day</span> <span class="v">${DAY_FULL[sel.day]}</span></span>`+
    `<span><span class="k">+5 h lead → dep by</span> <span class="win">${reach}</span></span>`+
    `<span class="n ${flights.length?'':'zero'}">${flights.length} flight${flights.length===1?'':'s'}</span>`;

  drawMap(flights);

  listHdr.textContent = flights.length ? `Covered flights (dep ${sb.start}–${reach}, incl. 5 h lead time)` : '';
  list.innerHTML = flights.length
    ? flights.map(flightRowHTML).join('')
    : `<div class="empty">No operating ${fleetLabel} freighters depart <b>${sel.base}</b> between <b>${sb.start}</b> and <b>${reach}</b> (${sb.code} + 5 h lead time) on <b>${DAY_FULL[sel.day]}</b>.</div>`;
}

  '470|Wed':'P7535WED_MEL',
  '470|Thu':'P7525_MEL_THU',

// Z crew (3rd pilot) variants, shown via the in-pattern Crew toggle
const PATTERN_Z_OF = {
  '7535|Thu':'P7535THU_Z',
};

const overlay = document.getElementById('patternOverlay');
function legLabel(c){ return /^[0-9]+$/.test(c) ? 'QF'+String(parseInt(c,10)) : c; }
function keyFor(map, flight, day){ return map[flight+'|'+day] || map[flight+'|*']; }
let curFlight=null, curDay=null, curZ=false;
function openPattern(flight, day){
  curFlight = flight; curDay = day; curZ = false;
  renderPattern();
  overlay.hidden = false; document.body.style.overflow = 'hidden';
}
function renderPattern(){
  const flight = curFlight, day = curDay;
  const zKey = keyFor(PATTERN_Z_OF, flight, day);
  const normKey = keyFor(PATTERN_OF, flight, day);
  const ct = document.getElementById('crewToggle');
  if(zKey){
    ct.hidden = false;
    ct.querySelectorAll('.msOpt').forEach(o=>o.classList.toggle('active', (o.dataset.crew==='z')===curZ));
  } else { ct.hidden = true; curZ = false; }
  const pat = PATTERNS[ (curZ && zKey) ? zKey : normKey ];
  document.getElementById('patTitle').textContent = legLabel(flight)+' — full pattern'+((curZ&&zKey)?' · Z crew':'');
  const sub = document.getElementById('patSub'), body = document.getElementById('patBody');
  if(!pat){
    sub.textContent = '';
    body.innerHTML = `<div class="patEmpty">The full pattern for <b>${legLabel(flight)}</b>${day?` on <b>${day}</b>`:''} hasn’t been loaded yet.<br>Send its pairing sheet and I’ll add it.</div>`;
    return;
  }
  sub.textContent = pat.title || '';
  body.innerHTML = pat.days.map(d=>{
    const legsHtml = d.legs.map(l=>{
      const hi = l.code===flight ? ' hi':'';
      const tag = l.pax ? '<span class="pTag">PAX</span> ' : '<span class="opTag">OP</span> ';
      const bits = [];
      if(l.blk && !l.pax) bits.push('Blk '+l.blk);
      if(l.grnd) bits.push('Grnd '+l.grnd);
      return `<div class="patLeg ${l.pax?'pax':'op'}${hi}">
          <div class="plTop"><span class="plNo">${tag}${legLabel(l.code)}</span><span class="plEq">${l.eq||''}</span></div>
          <div class="plRoute">${l.dep} ${l.depT} → ${l.arr} ${l.arrT}</div>
          ${bits.length?`<div class="plGrnd">${bits.join(' · ')}</div>`:''}
        </div>`;
    }).join('');
    let duty = d.rpt ? `Sign-on ${d.rpt} · Sign-off ${d.rls}` : '';
    if(d.rest) duty += (duty?' · ':'') + `Rest ${d.rest} at ${d.restPort}`;
    else if(d.restPort) duty += (duty?' · ':'') + `Layover at ${d.restPort}`;
    return `<div class="patDay"><div class="patDate">${d.wd}</div>${legsHtml}${duty?`<div class="patDuty">${duty}</div>`:''}</div>`;
  }).join('') + (pat.footer?`<div class="patFooter">${pat.footer}</div>`:'');
}
function closePattern(){ overlay.hidden = true; document.body.style.overflow = ''; }
document.getElementById('crewToggle').addEventListener('click', e=>{
  const opt = e.target.closest('.msOpt'); if(!opt) return;
  curZ = (opt.dataset.crew==='z'); renderPattern();
});

document.getElementById('list').addEventListener('click', e=>{
  const row = e.target.closest('.flightRow[data-flight]'); if(!row) return;
  openPattern(row.dataset.flight, sel.day);
});
document.getElementById('patClose').addEventListener('click', closePattern);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closePattern(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !overlay.hidden) closePattern(); });
